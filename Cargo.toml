[package]
name = "noted"
version = "0.2.1"
edition = "2021"
description = "A minimal, themable Markdown notes app."
authors = ["Dan Bednarski <dan.j.bednarski@gmail.com>"]
license = "MIT"
repository = "https://github.com/danbednarski/noted"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
dirs = "6"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
muda = "0.19"

[profile.release]
opt-level = 3
lto = "thin"

[package.metadata.bundle]
name = "Noted"
identifier = "com.bednarski.noted"
icon = ["assets/icon.icns"]
category = "public.app-category.productivity"
short_description = "A minimal, themable Markdown notes app."
long_description = """
Noted is a lightweight Markdown notes app with retro themes
(CandyCane, Win95, Dracula), live syntax highlighting, and a
fast egui-based UI.
"""
copyright = "Copyright (c) 2026 Dan Bednarski"
osx_minimum_system_version = "11.0"

# Press-and-hold accent panel: see src/mac_ime.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSAttributedString", "NSValue", "NSArray"] }
objc2-app-kit = { version = "0.2", features = ["NSEvent", "NSResponder"] }
